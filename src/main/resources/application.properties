spring.application.name=Intern_Taks

# Keep cached search results after the application restarts.
spring.datasource.url=jdbc:h2:file:./data/company-search
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Useful while developing locally; remove or secure this in production.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
